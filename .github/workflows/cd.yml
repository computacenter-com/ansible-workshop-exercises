---
name: Github Pages Deployment
on:
  release:
    types:
      - published
  workflow_call:
jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      packages: write
    steps:
      - name: Enable Pages and extract various metadata
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Checkout repository
        uses: actions/checkout@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Install Zensical & dependencies
        run: pip install -r requirements.txt
      - name: Build site
        run: zensical build --clean --strict
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
